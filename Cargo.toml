[package]
name = "signet"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
eframe = "0.37.0"
egui = "0.37.0"
epaint_default_fonts = "0.37.0"
image = "0.25.10"
lopdf = { version = "0.45.0", default-features = false }
once_cell = "1.21.4"
pdfium-render = "0.9.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication"] }
objc2-foundation = { version = "0.2.2", features = ["NSURL", "NSArray", "NSObject", "NSString"] }

[dev-dependencies]
tempfile = "3.27.0"
